# DataHub 配置 — 启用的模块在此声明。
# 新增模块：建一个 module/<name>.py，并在下面加一段 [module.<name>]。

[hub]
log_level = "INFO"
log_file = "datahub.log"

# --- 内置：系统 heartbeat 模块(建议开启) ------------------------------
[module.heartbeat]
enabled = true
interval = 5.0

# --- 内置：echo 测试模块（冒烟用，平时建议关掉）------------------------------
[module.echo]
enabled = false
interval = 5

# --- DB：MySQL --------------------------------------------------------------
[module.mysql]
enabled = false
host = "127.0.0.1"
port = 3306
user = "datahub"
password = ""
database = "datahub"
pool_size = 5
# 留空表示 message/db.py 里 TABLES 注册的全部启用
enabled_tables = ["bot_message"]

# --- IM：QQ (OneBot v11 / napcat) -------------------------------------------
[module.im_qq]
enabled = false
ws_url = "ws://127.0.0.1:3001"
access_token = ""
bot_id = 0
bot_name = "bot"
whitelist_groups = []
whitelist_users = []

# --- IM：Telegram -----------------------------------------------------------
[module.telegram_bot]
enabled = false
token = ""

# --- LLM：OpenAI 兼容接口 ----------------------------------------------------
[module.llm_openai]
enabled = false
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
system_prompt = "You are a helpful assistant."
max_context_tokens = 64000

# --- Util: Weather ----------------------------------------------------------
# weather 工具类, 必须启用才能支持天气推送功能
[module.weather]
enabled = true
## scheduler 控制周期推送功能调度, 需要传递 cron 字符串(例如每天推送: 0 8 * * *), 留空表示不进行周期推送
schedule = ""
# 支持往多个 im 通道发送
platform = ["telegram"]
chat_id = [""]
sub_type = [""]
message_type = [""]
# 第三方获取 weather 的平台配置
# 高德
amap_key = "amap_key"

# --- WorkFlow ----------------------------------------------------------------
# 天气助理编排模块 —— 订阅 im.message，通过 ctx.invoke 调用 llm.chat 和 weather.forecast
# 依赖：llm_openai（提供 LLMChatService）+ weather（提供 WeatherForecastService）
#      必须同时启用这两个模块，否则 loader 会在启动阶段拒绝加载

[module.weather_assistant]
enabled = true
