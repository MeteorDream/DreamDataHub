# DataHub 配置 — 启用的模块在此声明。
# 新增模块：建一个 module/<name>.py，并在下面加一段 [module.<name>]。

[hub]
log_level = "INFO"
log_dir = "log"

# --- 内置：系统 heartbeat 模块(建议开启) ------------------------------
[module.heartbeat]
enabled = true
interval = 5.0

# --- 内置：echo 测试模块（冒烟用，平时建议关掉）------------------------------
[module.echo]
enabled = false
interval = 5

# --- DB：MySQL --------------------------------------------------------------
[module.mysql]
enabled = false
host = "127.0.0.1"
port = 3306
user = "datahub"
password = ""
database = "datahub"
pool_size = 5
# 留空表示 message/db.py 里 TABLES 注册的全部启用
# 目前注册的：bot_message / user
enabled_tables = ["bot_message", "user"]

# --- IM：NapCat Bot (napcat 骨架) ------------------------------------------
[module.napcat_bot]
enabled = false
ws_url = "ws://127.0.0.1:3001"
access_token = ""
bot_id = 0
bot_name = "bot"
whitelist_groups = []
whitelist_users = []

# --- IM：Telegram -----------------------------------------------------------
[module.telegram_bot]
enabled = false
token = ""

# --- LLM：OpenAI 兼容接口 ----------------------------------------------------
[module.llm_openai]
enabled = false
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
system_prompt = "You are a helpful assistant."
max_context_tokens = 64000

# --- Util: Weather ----------------------------------------------------------
# 天气模块：通过 provider 字段选择数据源，具体 provider config 走子表
# 多 provider 抽象实现在 services/weather/ 目录下（base.py + 各 provider 文件）
[module.weather]
enabled = true
# provider = "amap" | "baidumap" | "xinzhi" ...  见 services/weather/__init__.py:PROVIDERS
provider = "amap"
# cron 周期推送（暂未接入推送目标，只做占位）；留空表示不推送
schedule = ""

# provider 特定配置：table key 必须与 provider 字段一致
[module.weather.amap]
key = "your_amap_key_here"
timeout = 15.0

# 未来其他 provider（示例）：
# [module.weather.baidumap]
# key = "your_baidu_key"
# [module.weather.xinzhi]
# key = "your_xinzhi_key"
