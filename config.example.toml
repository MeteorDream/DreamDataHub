# DataHub 配置 — 启用的模块在此声明。
# 新增模块：建一个 module/<name>.py，并在下面加一段 [module.<name>]。

[hub]
log_level = "INFO"
log_file = "datahub.log"

# --- 内置：系统 heartbeat 模块(建议开启) ------------------------------
[module.heartbeat]
enabled = true
interval = 5.0

# --- 内置：echo 测试模块（冒烟用，平时建议关掉）------------------------------
[module.echo]
enabled = false
interval = 5

# --- DB：MySQL --------------------------------------------------------------
[module.mysql]
enabled = false
host = "127.0.0.1"
port = 3306
user = "datahub"
password = ""
database = "datahub"
pool_size = 5
# 留空表示 message/db.py 里 TABLES 注册的全部启用
enabled_tables = ["bot_message"]

# --- IM：QQ (OneBot v11 / napcat) -------------------------------------------
[module.im_qq]
enabled = false
ws_url = "ws://127.0.0.1:3001"
access_token = ""
bot_id = 0
bot_name = "bot"
whitelist_groups = []
whitelist_users = []

# --- IM：Telegram -----------------------------------------------------------
[module.telegram_bot]
enabled = false
token = ""

# --- LLM：OpenAI 兼容接口 ----------------------------------------------------
[module.llm_openai]
enabled = false
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
system_prompt = "You are a helpful assistant."
max_context_tokens = 64000

# --- Util: Weather ----------------------------------------------------------
# weather 工具类, 必须启用才能支持天气推送功能
[module.weather]
enabled = true
## schedule 控制是否启用周期推送功能
schedule = false
# 支持往多个 im 通道发送
platform = ["telegram"]
chat_id = [""]
sub_type = [""]
message_type = [""]
# 第三方获取 weather 的平台配置
# 高德
amap_key = "amap_key"

# --- WorkFlow ----------------------------------------------------------------
# Workflow 是编排型模块，通过 WorkflowContext.invoke() 调用其他模块的 provides 能力
# 两种触发方式：1) 订阅 topic（subscribe）；2) 模块中通过 ctx.start_workflow() 主动触发
#
# 新增 workflow：在 workflow/<name>.py 中定义 Workflow 实例，并在此添加配置段

[workflow.weather_assistant]
enabled = true
description = "天气助理 — LLM 判断意图 → 查天气 → LLM 生成回复 → 发布到 im.reply"
subscribe = "im.message"
# timeout 为 0 表示不设超时限制；大于 0 为超时秒数
timeout = 0
